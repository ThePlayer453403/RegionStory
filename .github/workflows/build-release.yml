name: Build and Package Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Fabric mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JAR
        shell: bash
        run: ./gradlew build --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: regionstory-build-${{ github.ref_name }}
          path: |
            build/libs/regionstory-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Attach JAR to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar_file="$(find build/libs -maxdepth 1 -type f -name 'regionstory-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$jar_file"
          gh release upload "$GITHUB_REF_NAME" "$jar_file" --repo "$GITHUB_REPOSITORY" --clobber
